# ====================================================================
# AMAP — full application stack (PostgreSQL + migrations + seed +
# backend + frontend) runnable from a clean checkout:
#
#   docker compose up --build
#
# Services
#   postgres   PostgreSQL 16 with healthcheck
#   migrate    runs database/migrations 001..051, then database/seed
#              (idempotent; completes successfully before backend starts)
#   backend    FastAPI + Vosk streaming voice pipeline, gesture and
#              multimodal APIs; local model directory bind-mounted from
#              (Vosk models are baked into the backend image at build
#              time — see deployment/docker/Dockerfile.backend)
#   frontend   Next.js standalone server (MediaPipe assets generated by
#              postinstall during image build)
#
# Verified gates run in CI (.github/workflows/ci.yml), which executes
# `docker compose build` + `docker compose up` on a clean checkout.
# ====================================================================

services:
  postgres:
    image: postgres:16
    container_name: amap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amap}
      POSTGRES_USER: ${POSTGRES_USER:-amap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amap_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amap_user} -d ${POSTGRES_DB:-amap}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    image: amap-backend:local
    command:
      - /bin/sh
      - -c
      - |
        python /app/scripts/migrate.py &&
        python /app/scripts/seed.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amap_user}:${POSTGRES_PASSWORD:-amap_password}@postgres:5432/${POSTGRES_DB:-amap}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: amap-backend:local
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: amap-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amap_user}:${POSTGRES_PASSWORD:-amap_password}@postgres:5432/${POSTGRES_DB:-amap}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-amap-local-compose-jwt-secret-key-0123456789abcdef}
      ENVIRONMENT: ${AMAP_ENV:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: amap-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  amap_postgres_data:
