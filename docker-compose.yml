services:
  postgres:
    image: postgres:16
    container_name: amap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amap
      POSTGRES_USER: amap_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amap_user -d amap"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  amap_postgres_data: