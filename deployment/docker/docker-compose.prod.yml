services:
  postgres:
    image: postgres:16-alpine
    container_name: amap-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amap}
      POSTGRES_USER: ${POSTGRES_USER:-amap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - amap_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amap_user} -d ${POSTGRES_DB:-amap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amap-internal

  # Applies database/migrations 001..052 then the seed (idempotent).
  # The consolidated database/schema/schema.sql snapshot (001-040) is NOT
  # used: it predates migrations 041-052.
  migrate:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    image: amap-backend:local
    command:
      - /bin/sh
      - -c
      - |
        python /app/scripts/migrate.py &&
        python /app/scripts/seed.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amap_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amap}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - amap-internal

  redis:
    image: redis:7-alpine
    container_name: amap-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-amap_redis_secure_pass}"
    volumes:
      - amap_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amap-internal

  # One-shot: builds the local faster-whisper tiny model (EN+HI) into the
  # shared amap_whisper_cache volume so /voice/transcribe works on a fresh
  # deployment without any network access at runtime. Skips instantly when
  # the volume already contains the model.
  whisper-prefetch:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.whisper
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /cache/tiny/model.bin ]; then
          echo "whisper model already present in volume"
        else
          python /work/scripts/prefetch_whisper_model.py &&
          mkdir -p /cache &&
          cp -r /work/backend/.whisper_cache/. /cache/
        fi
    volumes:
      - amap_whisper_cache:/cache
    restart: "no"
    networks:
      - amap-internal

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: amap-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amap_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amap}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD:-amap_redis_secure_pass}@redis:6379/0
      ENVIRONMENT: production
    volumes:
      # Local faster-whisper model (built by whisper-prefetch) — the model is
      # gitignored, so it must be provisioned per-deployment, never baked in.
      - amap_whisper_cache:/app/backend/.whisper_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      whisper-prefetch:
        condition: service_completed_successfully
    networks:
      - amap-internal

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: amap-prod-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://nginx/api/v1
    depends_on:
      - backend
    networks:
      - amap-internal

  nginx:
    image: nginx:alpine
    container_name: amap-prod-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - amap-internal

volumes:
  amap_prod_postgres_data:
  amap_prod_redis_data:
  amap_whisper_cache:

networks:
  amap-internal:
    driver: bridge
