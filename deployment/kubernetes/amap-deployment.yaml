apiVersion: v1
kind: Namespace
metadata:
  name: amap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amap-config
  namespace: amap
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  NEXT_PUBLIC_API_URL: "https://amap.factory.internal/api/v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amap-backend
  namespace: amap
  labels:
    app: amap-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: amap-backend
  template:
    metadata:
      labels:
        app: amap-backend
    spec:
      containers:
        - name: backend
          image: amap/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: amap-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: amap-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amap-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: amap-backend-service
  namespace: amap
spec:
  selector:
    app: amap-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amap-frontend
  namespace: amap
  labels:
    app: amap-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amap-frontend
  template:
    metadata:
      labels:
        app: amap-frontend
    spec:
      containers:
        - name: frontend
          image: amap/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: amap-frontend-service
  namespace: amap
spec:
  selector:
    app: amap-frontend
  ports:
    - port: 3000
      targetPort: 3000
